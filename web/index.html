<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Code Factory</title>
<style>
:root{font:14px system-ui,sans-serif;color:#22332d;background:#f6f8f5}body{margin:0}#boot-nav{display:flex;gap:6px;padding:12px;flex-wrap:wrap}#boot-nav button,#boot-controls input,#boot-controls select{font:inherit;min-height:32px;border:1px solid #dce4dd;border-radius:4px;background:#fff;color:inherit;padding:5px 8px}#boot-nav button{cursor:pointer}#boot-nav [aria-current]{background:#e7f0e9}#boot-controls{padding:12px}#boot-controls p{color:#5c6c63}[data-code-factory-view="settings"] #boot-nav,[data-code-factory-view="settings"] #boot-controls{display:none}#boot-settings{display:none;padding:12px}[data-code-factory-view="settings"] #boot-settings{display:block}
</style></head>
<body><div id="root"><main>
<nav id="boot-nav" aria-label="Main navigation">
<button data-tab="Working">Working</button><button data-tab="Inbox" aria-current="page">Issues</button><button data-tab="Mine">My PRs</button><button data-tab="Review">Review PRs</button><button data-tab="Messages">Messages</button><button data-tab="Reported issues">Reported issues</button>
<span role="status" aria-label="Connection status">Connecting to Work…</span>
</nav>
<section id="boot-controls" aria-label="Issues">
<input aria-label="Search inbox" placeholder="Search"/><select aria-label="Inbox filter"><option>open</option><option>all</option><option>pending</option><option>new</option><option>unread</option><option>acted-on</option></select>
<p role="status">Loading saved state…</p>
</section><p id="boot-settings" role="status">Loading settings…</p></main></div>
<script>
window.factoryBoot={tab:"Inbox",search:"",filter:"open"};
document.getElementById("boot-nav").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;window.factoryBoot.tab=b.dataset.tab;this.querySelectorAll("button").forEach(function(n){n.removeAttribute("aria-current")});b.setAttribute("aria-current","page");var c=document.getElementById("boot-controls");c.setAttribute("aria-label",b.textContent);c.querySelector("input").hidden=c.querySelector("select").hidden=["Messages","Reported issues"].includes(b.dataset.tab);});
document.querySelector("#boot-controls input").addEventListener("input",function(){window.factoryBoot.search=this.value});
document.querySelector("#boot-controls select").addEventListener("change",function(){window.factoryBoot.filter=this.value});
document.getElementById("boot-nav").dataset.ready="true";
</script>
<script type="module" src="/src/main.tsx"></script>
</body></html>
