name: Investigate a Code Factory observation and draft an issue
on:
  workflow_call:
    inputs:
      report_id: {type: string, required: true}
      prompt: {type: string, required: true}
jobs:
  investigate:
    steps:
      - id: inspect
        uses: agent/investigator
        with:
          prompt: ${{ inputs.prompt }}
          output:
            format: json
            repair-attempts: 0
            schema:
              type: object
              additionalProperties: false
              required: [classification, summary, missingInformation, component, sourcePath, sourceCommit, ownershipReason, duplicateNumber, title, content, templateId, answers, labels, guidanceReviewed, restriction, restrictionReason, version]
              properties:
                classification: {type: string, enum: [confirmed, suspected, duplicate, insufficient_information, explained, invalid, resolved]}
                summary: {type: string}
                missingInformation: {type: string}
                component: {type: string, enum: [code-factory, plugin, agent-workflow, dk-workflows, unknown]}
                sourcePath: {type: string}
                sourceCommit: {type: string}
                ownershipReason: {type: string}
                duplicateNumber: {type: integer}
                title: {type: string}
                labels: {type: array, items: {type: string}}
                version: {type: integer, enum: [2]}
                templateId: {type: string}
                guidanceReviewed: {type: array, items: {type: string}}
                restriction: {type: string, enum: [none, security, support]}
                restrictionReason: {type: string}
                content:
                  type: object
                  additionalProperties: false
                  required: [environment, reproduction, expected, actual, evidence, findings, uncertainty]
                  properties:
                    environment: {type: string}
                    reproduction: {type: string}
                    expected: {type: string}
                    actual: {type: string}
                    evidence: {type: string}
                    findings: {type: string}
                    uncertainty: {type: string}
                answers:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, text, choices]
                    properties:
                      id: {type: string}
                      text: {type: string}
                      choices: {type: array, items: {type: string}}
