name: Browser correctness benchmark

on:
  pull_request:
    paths:
      - 'web/**'
      - 'internal/**'
      - 'cmd/**'
      - go.mod
      - go.sum
      - Makefile
      - 'plugin/**'
      - scripts/package_plugin.py
      - scripts/benchmark_browser.py
      - scripts/test_browser_benchmark.py
      - scripts/test_ci.py
      - .github/workflows/browser-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODE_FACTORY_REAL_CODEX: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Prepare fixture browser suite
        run: make ui plugin-embed fake-provider browser-deps
      - name: Compare serial and bounded parallel correctness
        run: python3 scripts/benchmark_browser.py --output web/benchmark-results
      - name: Retain correctness comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-correctness-benchmark
          path: |
            web/benchmark-results/
            web/test-results/
          retention-days: 7
          if-no-files-found: warn
