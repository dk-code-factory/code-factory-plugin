name: Browser correctness benchmark

on:
  pull_request:
    paths:
      - web/playwright.config.ts
      - .github/workflows/browser-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODE_FACTORY_REAL_CODEX: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare fixture browser suite
        run: |
          make fake-provider
          npm ci --prefix web
          cd web && npx playwright install --with-deps chromium
      - name: Compare serial and bounded parallel correctness
        working-directory: web
        run: |
          mkdir -p benchmark-results
          node --version > benchmark-results/environment.txt
          npx playwright --version >> benchmark-results/environment.txt
          git rev-parse HEAD >> benchmark-results/environment.txt
          # Alternate worker counts to expose ordering/cache effects. Each
          # invocation starts fresh servers and has zero assertion retries.
          for sample in 1 2; do
            for workers in 1 2; do
              /usr/bin/time -f 'elapsed_seconds=%e\nmax_process_rss_kib=%M' \
                -o "benchmark-results/workers-${workers}-${sample}.txt" \
                npx playwright test --workers="$workers" --retries=0 --reporter=json \
                > "benchmark-results/workers-${workers}-${sample}.json"
            done
          done
      - name: Retain correctness comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-correctness-benchmark
          path: |
            web/benchmark-results/
            web/test-results/
          retention-days: 7
          if-no-files-found: warn
